defaults:
  - launcher: local
  - solver: cem
  - objective: goal_mse
  - _self_

# Closed-loop eval on the MULTIMODAL TwoRoom (2 symmetric doors). Same D-MPC
# planner as tworoom_diffusion.yaml; the only differences are the 2-door env
# geometry (eval.options) and the multimodal dataset for init/goal states.

world:
  env_name: swm/TwoRoom-v1
  num_envs: ${eval.num_eval}
  max_episode_steps: ???

dataset:
  stats: ${eval.dataset_name}
  keys_to_cache:
    - action
    - proprio

seed: 42
policy: ???  # diffusion (latent_diffusion_tworoom_mm_v/...) or deterministic (lewm_tworoom/...)

plan_config:
  horizon: 8
  receding_horizon: 5
  history_len: 3
  action_block: 5

solver:
  num_samples: 64

eval:
  num_eval: 50
  goal_offset_steps: 25
  eval_budget: 50
  img_size: 224
  dataset_name: tworoom_mm0.lance
  # Fixed 2-door geometry matching the training data so the eval scene is
  # in-distribution for the diffusion model.
  options:
    variation_values:
      door.number: 2
      door.position: [60, 164, 49]
      door.size: [14, 14, 14]
  callables:
    - method: _set_state
      args:
        state:
          value: state
    - method: _set_goal_state
      args:
        goal_state:
          value: goal_state

compile: false
bf16: false

output:
  filename: tworoom_mm_diffusion_results.txt
