defaults:
  - launcher: local
  - solver: cem
  - _self_

world:
  env_name: swm/TwoRoom-v1
  num_envs: ${eval.num_eval}
  max_episode_steps: ??? # set by eval_wm to 2 * eval_budget

dataset:
  stats: ${eval.dataset_name}
  keys_to_cache:
    - action
    - proprio

seed: 42
policy: ??? # tworoom diffusion checkpoint, e.g. latent_diffusion_tworoom/weights_epoch_100.pt

# Same D-MPC planner as pusht_diffusion.yaml; only the env, dataset, and the
# goal/state callable keys differ. history_len=3 / horizon=8 match the trained
# denoiser layout.
plan_config:
  horizon: 8
  receding_horizon: 5
  history_len: 3
  action_block: 5 # frameskip

solver:
  num_samples: 64

eval:
  num_eval: 50
  goal_offset_steps: 25
  eval_budget: 50
  img_size: 224
  dataset_name: tworoom_expert.lance
  # Keys must exist in the merged init/goal state or _apply_callables skips
  # them silently. The lance dataset + current TwoRoom env use `state`;
  # `goal_state` is the expert state goal_offset_steps later (pos_agent is
  # the legacy-env naming).
  callables:
    - method: _set_state
      args:
        state:
          value: state
    - method: _set_goal_state
      args:
        goal_state:
          value: goal_state

compile: false
bf16: false

output:
  filename: tworoom_diffusion_results.txt
