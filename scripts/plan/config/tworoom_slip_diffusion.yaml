defaults:
  - launcher: local
  - solver: cem
  - objective: goal_mse
  - _self_

# Closed-loop D-MPC on the intrinsic-SLIP TwoRoom (P1 Route 1 verdict cell).
# Same planner as tworoom_diffusion.yaml; the env gets slip_scale forwarded
# through World(**world) -> gym.make -> TwoRoomEnv, and the eval dataset is the
# matching slip collection (init/goal states drawn from the same distribution
# the dynamics model was trained on).

world:
  env_name: swm/TwoRoom-v1
  num_envs: ${eval.num_eval}
  max_episode_steps: ??? # set by eval_wm to 2 * eval_budget
  slip_scale: 8.0

dataset:
  stats: ${eval.dataset_name}
  keys_to_cache:
    - action
    - proprio

seed: 42
policy: ??? # e.g. dyn_diff_slip8_ps1/weights_epoch_250.pt

plan_config:
  horizon: 8
  receding_horizon: 5
  history_len: 3
  action_block: 5 # frameskip

solver:
  num_samples: 64

eval:
  num_eval: 50
  goal_offset_steps: 25
  eval_budget: 50
  img_size: 224
  dataset_name: tworoom_slip8.lance
  callables:
    - method: _set_state
      args:
        state:
          value: state
    - method: _set_goal_state
      args:
        goal_state:
          value: goal_state

compile: false
bf16: false

output:
  filename: tworoom_slip_diffusion_results.txt
