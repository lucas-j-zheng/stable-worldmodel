defaults:
  - launcher: local
  - solver: diffusion_policy
  - objective: goal_mse
  - _self_

# Closed-loop eval of a trained DiffusionPolicy / MLPPolicy. Same env + plan
# layout as tworoom_diffusion.yaml, but the "solver" is the generative policy
# (no CEM). Override eval.options + eval.dataset_name for the 2-door multimodal
# variant; defaults here are the 1-door greedy env (smoke / in-dist for
# lewm_tworoom).

world:
  env_name: swm/TwoRoom-v1
  num_envs: ${eval.num_eval}
  max_episode_steps: ???

dataset:
  stats: ${eval.dataset_name}
  keys_to_cache:
    - action
    - proprio

seed: 42
policy: ???  # trained policy checkpoint (dp_* or mlp_*)

plan_config:
  horizon: 8
  receding_horizon: 5
  history_len: 3
  action_block: 5

# Present for harness compatibility; the diffusion-policy solver ignores it.
solver:
  device: cuda

eval:
  num_eval: 50
  goal_offset_steps: 25
  eval_budget: 50
  img_size: 224
  dataset_name: tworoom_expert.lance
  callables:
    - method: _set_state
      args:
        state:
          value: state
    - method: _set_goal_state
      args:
        goal_state:
          value: goal_state

compile: false
bf16: false

output:
  filename: diffusion_policy_eval_results.txt
